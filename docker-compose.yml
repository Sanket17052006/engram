services:
  core:
    build:
      context: ./backend
    env_file:
      - .env.local
    environment:
      FALKORDB_URL: redis://falkordb:6379
      ENGRAM_CODEBASE_ROOT: /source
      ENGRAM_OLLAMA_OPENAI_URL: http://host.docker.internal:3100/api/internal/ollama/v1/chat/completions
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    depends_on:
      - falkordb
    volumes:
      - ${ENGRAM_CODEBASE_PATH:-../openlibrary}:/source:ro
  falkordb:
    image: falkordb/falkordb:latest
    ports:
      - "127.0.0.1:6379:6379"
      - "127.0.0.1:3002:3000"
    volumes:
      - falkordb_data:/var/lib/falkordb/data
volumes:
  falkordb_data:
