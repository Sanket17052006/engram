<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="500" viewBox="0 0 1320 500" role="img" aria-labelledby="title desc">
  <title id="title">Engram graph explorer flow</title><desc id="desc">The graph explorer requests a repository-scoped neighborhood from FalkorDB, renders returned nodes and relationships, filters the loaded neighborhood, and loads a new neighborhood when the user follows a node.</desc>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#78867c"/></marker><style>
    text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#27352c}.title{font-size:30px;font-weight:750}.sub{font-size:15px;fill:#6f7d73}.k{font-size:12px;font-weight:750;letter-spacing:1.4px;fill:#7a887d}.h{font-size:17px;font-weight:700}.p{font-size:13px;fill:#66746b}.card{fill:#fff;stroke:#dfe5dc;stroke-width:1.5}.green{fill:#eef5ef;stroke:#c8d9ca}.orange{fill:#fff5e9;stroke:#edcfab}.line{stroke:#78867c;stroke-width:2;fill:none;marker-end:url(#a)}.foot{font-size:12px;fill:#758279}
  </style></defs>
  <rect width="1320" height="500" rx="24" fill="#fbfaf6"/><text class="title" x="48" y="58">4 · Explore the connected graph</text><text class="sub" x="50" y="86">The canvas visualizes a bounded FalkorDB neighborhood; filters help you inspect it without crowding the screen.</text>
  <g transform="translate(48 150)"><rect class="card" width="220" height="170" rx="16"/><text class="k" x="18" y="30">FOCUS</text><text class="h" x="18" y="64">Start at a node</text><text class="p" x="18" y="96">Signed in: your contributor</text><text class="p" x="18" y="120">node. Guest: repository.</text><text class="p" x="18" y="150">Or open from a selected node.</text></g>
  <path class="line" d="M268 235H318"/>
  <g transform="translate(324 150)"><rect class="card green" width="220" height="170" rx="16"/><text class="k" x="18" y="30">QUERY</text><text class="h" x="18" y="64">Read from FalkorDB</text><text class="p" x="18" y="96">Load recent direct links</text><text class="p" x="18" y="120">and a bounded second hop.</text><text class="p" x="18" y="150">Scoped to this repository.</text></g>
  <path class="line" d="M544 235H594"/>
  <g transform="translate(600 150)"><rect class="card" width="220" height="170" rx="16"/><text class="k" x="18" y="30">VISUALIZE</text><text class="h" x="18" y="64">Render real records</text><text class="p" x="18" y="96">Nodes = repository entities.</text><text class="p" x="18" y="120">Edges = stored relationships.</text><text class="p" x="18" y="150">Labels show relation types.</text></g>
  <path class="line" d="M820 235H870"/>
  <g transform="translate(876 150)"><rect class="card orange" width="220" height="170" rx="16"/><text class="k" x="18" y="30">INSPECT</text><text class="h" x="18" y="64">Filter the view</text><text class="p" x="18" y="96">All · PRs · Issues · Reviews</text><text class="p" x="18" y="120">People · Commits · Files</text><text class="p" x="18" y="150">Search within loaded nodes.</text></g>
  <path class="line" d="M1096 235H1146"/>
  <g transform="translate(1152 150)"><rect class="card" width="140" height="170" rx="16"/><text class="k" x="16" y="30">FOLLOW</text><text class="h" x="16" y="64">Select</text><text class="p" x="16" y="96">Inspect details</text><text class="p" x="16" y="120">Load next links</text><text class="p" x="16" y="150">Go back / close</text></g>
  <path class="line" d="M1222 320V382H434V326"/>
  <text class="foot" x="50" y="430">Filters operate on the returned neighborhood; following a node makes a new repository-scoped graph query. The canvas is backed by FalkorDB, not a static illustration.</text>
</svg>
