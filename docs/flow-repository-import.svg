<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="480" viewBox="0 0 1320 480" role="img" aria-labelledby="title desc">
  <title id="title">Engram repository import flow</title><desc id="desc">A user connects GitHub or chooses a public repository. Engram fetches a bounded current snapshot, normalizes it, and stores repository entities and relationships in an isolated FalkorDB graph.</desc>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#78867c"/></marker><style>
    text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#27352c}.title{font-size:30px;font-weight:750}.sub{font-size:15px;fill:#6f7d73}.k{font-size:12px;font-weight:750;letter-spacing:1.4px;fill:#7a887d}.h{font-size:17px;font-weight:700}.p{font-size:13px;fill:#66746b}.card{fill:#fff;stroke:#dfe5dc;stroke-width:1.5}.green{fill:#eef5ef;stroke:#c8d9ca}.orange{fill:#fff5e9;stroke:#edcfab}.line{stroke:#78867c;stroke-width:2;fill:none;marker-end:url(#a)}.foot{font-size:12px;fill:#758279}
  </style></defs>
  <rect width="1320" height="480" rx="24" fill="#fbfaf6"/><text class="title" x="48" y="58">1 · Import a repository</text><text class="sub" x="50" y="86">A bounded snapshot is fetched and written into a repository-scoped FalkorDB graph.</text>
  <g transform="translate(48 145)"><rect class="card" width="220" height="190" rx="16"/><text class="k" x="18" y="30">ENTRY</text><text class="h" x="18" y="63">Choose a source</text><text class="p" x="18" y="94">Signed in: authorize GitHub</text><text class="p" x="18" y="118">and select an installed repo.</text><text class="p" x="18" y="154">Guest: enter a public repo.</text><text class="p" x="18" y="176">Guest graph is isolated.</text></g>
  <path class="line" d="M268 240H318"/>
  <g transform="translate(324 145)"><rect class="card" width="220" height="190" rx="16"/><text class="k" x="18" y="30">FETCH</text><text class="h" x="18" y="63">GitHub APIs</text><text class="p" x="18" y="94">Current PRs and issues,</text><text class="p" x="18" y="118">reviews, comments, files,</text><text class="p" x="18" y="142">commits, branches, people.</text><text class="p" x="18" y="176">Bounded recent window.</text></g>
  <path class="line" d="M544 240H594"/>
  <g transform="translate(600 145)"><rect class="card green" width="220" height="190" rx="16"/><text class="k" x="18" y="30">NORMALIZE</text><text class="h" x="18" y="63">Build typed records</text><text class="p" x="18" y="94">Repository · WorkItem</text><text class="p" x="18" y="118">Contributor · Review</text><text class="p" x="18" y="142">File · Comment · Commit</text><text class="p" x="18" y="176">Code files indexed separately.</text></g>
  <path class="line" d="M820 240H870"/>
  <g transform="translate(876 145)"><rect class="card orange" width="220" height="190" rx="16"/><text class="k" x="18" y="30">STORE</text><text class="h" x="18" y="63">FalkorDB graph</text><text class="p" x="18" y="94">Nodes + typed relations;</text><text class="p" x="18" y="118">separate user/repo scope.</text><text class="p" x="18" y="154">Cypher agents and explorer</text><text class="p" x="18" y="176">read the same evidence.</text></g>
  <path class="line" d="M1096 240H1146"/>
  <g transform="translate(1152 145)"><rect class="card" width="140" height="190" rx="16"/><text class="k" x="16" y="30">USE</text><text class="h" x="16" y="63">Ask</text><text class="p" x="16" y="94">Investigate</text><text class="p" x="16" y="118">Explore</text><text class="p" x="16" y="142">Trace sources</text></g>
  <text class="foot" x="50" y="395">GitHub is the source of current repository activity. FalkorDB stores the imported graph snapshot; if refresh fails, Engram can report the existing snapshot and sync status.</text>
</svg>
